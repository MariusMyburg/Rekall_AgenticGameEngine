name: Windows Developer Preview

on:
  push:
    branches:
      - master
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build and accept the Windows distribution
        shell: pwsh
        run: ./eng/build.ps1 -Configuration Release -RuntimeIdentifier win-x64

      - name: Upload test evidence on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rekall-age-test-results
          path: Artifacts/TestResults/**/*.trx
          if-no-files-found: warn

      - name: Upload accepted Windows distribution
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Rekall-AGE-0.1.0-preview.1-win-x64
          path: Artifacts/Distribution/Rekall-AGE-0.1.0-preview.1-win-x64.zip
          if-no-files-found: error
          compression-level: 0
